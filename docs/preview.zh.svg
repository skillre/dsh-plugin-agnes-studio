<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="Agnes Studio preview">
  <!-- Detail banner: the sidebar entry on the left, the studio panel on the
       right. Drawn with flat shapes only so it survives the whiteboard parser
       and stays readable at the rendered 640x300 size. -->
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="640" height="300" fill="#0b1220"/>

  <!-- Left: the sidebar rail with the new entry highlighted -->
  <rect x="24" y="24" width="96" height="252" rx="16" fill="#151d2e"/>
  <rect x="40" y="44" width="64" height="10" rx="5" fill="#2b3648"/>
  <rect x="40" y="70" width="46" height="8" rx="4" fill="#232d3d"/>
  <rect x="36" y="92" width="72" height="34" rx="10" fill="url(#accent)"/>
  <rect x="46" y="103" width="12" height="12" rx="3" fill="#ffffff"/>
  <rect x="64" y="104" width="34" height="4" rx="2" fill="#ffffff" fill-opacity="0.9"/>
  <rect x="64" y="112" width="24" height="4" rx="2" fill="#ffffff" fill-opacity="0.65"/>
  <rect x="40" y="140" width="56" height="8" rx="4" fill="#232d3d"/>
  <rect x="40" y="158" width="42" height="8" rx="4" fill="#232d3d"/>

  <!-- Right: the studio panel -->
  <rect x="136" y="24" width="480" height="252" rx="16" fill="url(#panel)"/>

  <!-- Panel header and the two capability tabs -->
  <text x="160" y="58" font-family="Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#f8fafc">Agnes Studio</text>
  <rect x="160" y="70" width="76" height="26" rx="13" fill="url(#accent)"/>
  <text x="176" y="88" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#ffffff">Images</text>
  <rect x="244" y="70" width="72" height="26" rx="13" fill="#26334a"/>
  <text x="258" y="88" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#c7d2e4">Video</text>

  <!-- Prompt field -->
  <rect x="160" y="110" width="288" height="46" rx="10" fill="#0f1726"/>
  <rect x="174" y="122" width="196" height="7" rx="3.5" fill="#3d4a63"/>
  <rect x="174" y="137" width="140" height="7" rx="3.5" fill="#2c374b"/>

  <!-- Parameter row -->
  <rect x="160" y="166" width="88" height="24" rx="7" fill="#1b2436"/>
  <text x="170" y="182" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#9fb0c9">2.5 Flash</text>
  <rect x="256" y="166" width="60" height="24" rx="7" fill="#1b2436"/>
  <text x="266" y="182" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#9fb0c9">2K</text>
  <rect x="324" y="166" width="60" height="24" rx="7" fill="#1b2436"/>
  <text x="334" y="182" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#9fb0c9">16:9</text>
  <rect x="392" y="166" width="56" height="24" rx="12" fill="#0ea5e9"/>
  <text x="402" y="182" font-family="Noto Sans SC, sans-serif" font-size="10" font-weight="700" fill="#04121f">Generate</text>

  <!-- Result gallery: two generated tiles -->
  <rect x="160" y="204" width="88" height="56" rx="8" fill="#2a3a56"/>
  <circle cx="186" cy="226" r="7" fill="#f59e0b"/>
  <path d="M168 252 L186 234 L200 248 L212 238 L240 258" fill="none" stroke="#7f93b5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="258" y="204" width="88" height="56" rx="8" fill="#243449"/>
  <rect x="272" y="220" width="60" height="8" rx="4" fill="#41546f"/>
  <rect x="272" y="234" width="44" height="8" rx="4" fill="#33455d"/>
  <path d="M330 240 L338 234 L346 240 L338 246 Z" fill="#a5b4cc"/>

  <!-- Right column: configuration state and the model note -->
  <rect x="464" y="110" width="128" height="98" rx="10" fill="#0f1726"/>
  <circle cx="480" cy="130" r="5" fill="#22c55e"/>
  <text x="492" y="134" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#c7d2e4">Key ready</text>
  <rect x="478" y="148" width="96" height="6" rx="3" fill="#2c374b"/>
  <rect x="478" y="162" width="76" height="6" rx="3" fill="#2c374b"/>
  <rect x="478" y="176" width="86" height="6" rx="3" fill="#2c374b"/>

  <text x="464" y="232" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#8fa3bf">agnes-image-2.5-flash</text>
  <text x="464" y="250" font-family="Noto Sans SC, sans-serif" font-size="11" fill="#6b7f9b">agnes-video-2.5</text>

  <!-- Footer hint -->
  <text x="160" y="266" font-family="Noto Sans SC, sans-serif" font-size="10" fill="#64748b">Sidebar entry + in-session tools: agnes_image / agnes_video</text>
</svg>
